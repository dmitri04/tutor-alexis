<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Alexis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0f3460;
        }

        header h1 {
            font-size: 1.2rem;
            color: #e94560;
        }

        header span {
            font-size: 0.85rem;
            color: #888;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mensaje {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .mensaje.usuario {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .mensaje.tutor {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #e94560;
        }

        .mensaje.sistema {
            background: #1a1a2e;
            align-self: center;
            color: #888;
            font-size: 0.85rem;
            border: 1px solid #333;
        }

        .typing {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #e94560;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        #input-area {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            border-top: 2px solid #0f3460;
        }

        #input-mensaje {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 12px 16px;
            color: #eee;
            font-size: 1rem;
            resize: none;
            height: 48px;
            max-height: 120px;
            outline: none;
        }

        #input-mensaje:focus {
            border-color: #e94560;
        }

        #btn-enviar {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-enviar:hover { background: #c73652; }
        #btn-enviar:disabled { background: #555; cursor: not-allowed; }

        /* Ocultar bloques de reporte en el chat */
        .reporte-oculto { display: none; }
    </style>
</head>
<body>

<header>
    <h1>📚 Tutor Personal</h1>
    <span th:text="${diagnosticoCompletado} ? 'Modo: Tutor' : 'Modo: Diagnóstico'"></span>
</header>

<div id="chat-container">
    <div class="mensaje sistema">
        Hola Alexis 👋 Tu tutor está listo. Escribe algo para comenzar.
    </div>
</div>

<div id="input-area">
    <textarea id="input-mensaje" placeholder="Escribe aquí..." rows="1"></textarea>
    <button id="btn-enviar">Enviar</button>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const inputMensaje = document.getElementById('input-mensaje');
    const btnEnviar = document.getElementById('btn-enviar');

    function agregarMensaje(texto, tipo) {
        // Ocultar bloques de reporte técnico
        let textoLimpio = texto
            .replace(/REPORTE_SESION_START[\s\S]*?REPORTE_SESION_END/g, '\n✅ *Reporte del día guardado para tu papá*')
            .replace(/PERFIL_ALEXIS_START[\s\S]*?PERFIL_ALEXIS_END/g, '')
            .replace(/PLAN_ESTUDIOS_START[\s\S]*?PLAN_ESTUDIOS_END/g, '\n📋 *Plan de estudios generado y guardado*')
            .replace(/REPORTE_EXAMEN_START[\s\S]*?REPORTE_EXAMEN_END/g, '\n📊 *Resultados del examen guardados*')
            .trim();

        const div = document.createElement('div');
        div.className = `mensaje ${tipo}`;
        div.textContent = textoLimpio;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function mostrarTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing-indicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function ocultarTyping() {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
    }

    async function enviarMensaje() {
        const texto = inputMensaje.value.trim();
        if (!texto) return;

        agregarMensaje(texto, 'usuario');
        inputMensaje.value = '';
        btnEnviar.disabled = true;
        mostrarTyping();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensaje: texto })
            });

            const data = await response.json();
            ocultarTyping();
            agregarMensaje(data.respuesta, 'tutor');
        } catch (error) {
            ocultarTyping();
            agregarMensaje('Hubo un error. Intenta de nuevo.', 'sistema');
        } finally {
            btnEnviar.disabled = false;
            inputMensaje.focus();
        }
    }

    btnEnviar.addEventListener('click', enviarMensaje);

    inputMensaje.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensaje();
        }
    });

    // Auto-resize textarea
    inputMensaje.addEventListener('input', () => {
        inputMensaje.style.height = '48px';
        inputMensaje.style.height = Math.min(inputMensaje.scrollHeight, 120) + 'px';
    });
</script>

</body>
</html>
