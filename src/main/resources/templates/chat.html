<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Alexis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #0f3460;
            gap: 16px;
        }

        .header-left h1 { font-size: 1.1rem; color: #e94560; }
        .header-left span { font-size: 0.8rem; color: #888; }

        .header-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat .valor {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e94560;
        }

        .stat .etiqueta {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
        }

        /* Barra de progreso */
        .progreso-bar {
            background: #0f3460;
            height: 4px;
        }

        .progreso-fill {
            background: #e94560;
            height: 100%;
            transition: width 0.5s ease;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mensaje {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .mensaje.usuario {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .mensaje.tutor {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #e94560;
        }

        .mensaje.sistema {
            background: transparent;
            align-self: center;
            color: #666;
            font-size: 0.82rem;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 6px 14px;
        }

        .mensaje img {
            max-width: 200px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }

        .typing {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #e94560;
            padding: 12px 16px;
            border-radius: 12px;
        }

        .typing span {
            display: inline-block;
            width: 7px; height: 7px;
            background: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-7px); }
        }

        #input-area {
            background: #16213e;
            padding: 12px 20px;
            border-top: 2px solid #0f3460;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #input-mensaje {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 10px 14px;
            color: #eee;
            font-size: 0.95rem;
            resize: none;
            height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }

        #input-mensaje:focus { border-color: #e94560; }

        #btn-imagen {
            background: #0f3460;
            color: #aaa;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 0 14px;
            height: 44px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        #btn-subir {
            background: #0f3460;
            color: #aaa;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 0 14px;
            height: 44px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        #btn-subir:hover { background: #1a3a6e; color: #eee; }
        #btn-imagen:hover { background: #1a3a6e; color: #eee; }
        #btn-imagen.activo { background: #e94560; color: white; border-color: #e94560; }

        #btn-enviar {
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            height: 44px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #btn-enviar:hover { background: #c73652; }
        #btn-enviar:disabled { background: #444; cursor: not-allowed; }

        #preview-imagen {
            display: none;
            margin-bottom: 8px;
            align-items: center;
            gap: 8px;
        }

        #preview-imagen img {
            height: 48px;
            border-radius: 6px;
            border: 2px solid #e94560;
        }

        #preview-imagen button {
            background: none;
            border: none;
            color: #e94560;
            cursor: pointer;
            font-size: 1rem;
        }

        #input-file { display: none; }

        /* Modal webcam */
        #modal-camara {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }
        #modal-camara.activo { display: flex; }
        #modal-camara video {
            width: 720px;
            max-width: 95vw;
            min-height: 400px;
            border-radius: 12px;
            border: 3px solid #e94560;
        }
        #modal-camara canvas { display: none; }
        .camara-botones { display: flex; gap: 12px; }
        .btn-capturar {
            background: #e94560; color: white; border: none;
            border-radius: 8px; padding: 12px 28px;
            font-size: 1rem; cursor: pointer;
        }
        .btn-cancelar-cam {
            background: #333; color: #aaa; border: none;
            border-radius: 8px; padding: 12px 20px;
            font-size: 1rem; cursor: pointer;
        }

        .btn-cerrar {
            background: none;
            border: 1px solid #333;
            color: #888;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cerrar:hover { border-color: #e94560; color: #e94560; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <h1>📚 Tutor Personal</h1>
        <span th:text="${diagnosticoCompletado} ? 'Modo Tutor activo' : 'Diagnóstico inicial'"></span>
    </div>
    <div class="header-stats">
        <div class="stat">
            <div class="valor" id="timer">0:00</div>
            <div class="etiqueta">Sesión</div>
        </div>
        <div class="stat">
            <div class="valor" th:text="${totalSesiones}">0</div>
            <div class="etiqueta">Sesiones</div>
        </div>
        <button class="btn-cerrar" onclick="cerrarSesion()">Terminar</button>
    </div>
</header>

<!-- Barra de progreso (días completados / 55 días hábiles) -->
<div class="progreso-bar">
    <div class="progreso-fill" id="progreso-fill"
         th:style="'width:' + ${(totalSesiones * 100 / 55)} + '%'"></div>
</div>

<div id="chat-container">
    <div class="mensaje sistema">
        Hola Alexis 👋 Tu tutor está listo. Escribe algo para comenzar.
    </div>
</div>

<!-- Modal Webcam -->
<div id="modal-camara">
    <video id="webcam-video" autoplay playsinline></video>
    <canvas id="webcam-canvas"></canvas>
    <div class="camara-botones">
        <button class="btn-capturar" onclick="capturarFoto()">📸 Tomar foto</button>
        <button class="btn-cancelar-cam" onclick="cerrarCamara()">Cancelar</button>
    </div>
</div>

<div id="input-area">
    <div id="preview-imagen">
        <img id="preview-img" src="" alt="preview"/>
        <button onclick="limpiarImagen()">✕ Quitar</button>
    </div>
    <div class="input-row">
        <button id="btn-imagen" onclick="abrirCamara()" title="Tomar foto">📷</button>
        <button id="btn-subir" onclick="document.getElementById('input-file').click()" title="Subir imagen guardada">🖼️</button>
        <input type="file" id="input-file" accept="image/*" onchange="previsualizarImagen(event)"/>
        <textarea id="input-mensaje" placeholder="Escribe aquí..."></textarea>
        <button id="btn-enviar">Enviar</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const inputMensaje = document.getElementById('input-mensaje');
    const btnEnviar = document.getElementById('btn-enviar');
    let imagenSeleccionada = null;
    let segundosSesion = 0;
    let timerInterval = null;

    // Timer de sesión
    timerInterval = setInterval(() => {
        segundosSesion++;
        const min = Math.floor(segundosSesion / 60);
        const seg = segundosSesion % 60;
        document.getElementById('timer').textContent = min + ':' + String(seg).padStart(2, '0');
    }, 1000);

    function previsualizarImagen(event) {
        const file = event.target.files[0];
        if (!file) return;
        imagenSeleccionada = file;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('preview-imagen').style.display = 'flex';
            document.getElementById('btn-imagen').classList.add('activo');
        };
        reader.readAsDataURL(file);
    }

    // Webcam
    let streamActivo = null;

    async function abrirCamara() {
        try {
            streamActivo = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcam-video').srcObject = streamActivo;
            document.getElementById('modal-camara').classList.add('activo');
        } catch (e) {
            // Si no hay webcam, fallback a subir archivo
            document.getElementById('input-file').click();
        }
    }

    function capturarFoto() {
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('webcam-canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(blob => {
            imagenSeleccionada = new File([blob], 'ejercicio.jpg', { type: 'image/jpeg' });
            document.getElementById('preview-img').src = canvas.toDataURL('image/jpeg');
            document.getElementById('preview-imagen').style.display = 'flex';
            document.getElementById('btn-imagen').classList.add('activo');
            cerrarCamara();
        }, 'image/jpeg', 0.9);
    }

    function cerrarCamara() {
        if (streamActivo) {
            streamActivo.getTracks().forEach(t => t.stop());
            streamActivo = null;
        }
        document.getElementById('modal-camara').classList.remove('activo');
    }

    function limpiarImagen() {
        imagenSeleccionada = null;
        document.getElementById('input-file').value = '';
        document.getElementById('preview-imagen').style.display = 'none';
        document.getElementById('btn-imagen').classList.remove('activo');
    }

    function agregarMensaje(texto, tipo, imagenSrc) {
        let textoLimpio = texto
            .replace(/REPORTE_SESION_START[\s\S]*?REPORTE_SESION_END/g, '\n✅ Reporte del día guardado — tu papá recibirá un email.')
            .replace(/PERFIL_ALEXIS_START[\s\S]*?PERFIL_ALEXIS_END/g, '')
            .replace(/PLAN_ESTUDIOS_START[\s\S]*?PLAN_ESTUDIOS_END/g, '\n📋 Plan de estudios generado y guardado.')
            .replace(/REPORTE_EXAMEN_START[\s\S]*?REPORTE_EXAMEN_END/g, '\n📊 Resultados del examen enviados a tu papá.')
            .trim();

        const div = document.createElement('div');
        div.className = `mensaje ${tipo}`;

        if (imagenSrc) {
            const img = document.createElement('img');
            img.src = imagenSrc;
            div.appendChild(img);
        }

        if (textoLimpio) {
            div.appendChild(document.createTextNode(textoLimpio));
        }

        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Cerrar sesión automáticamente al completar las 4 lecciones
        if (tipo === 'tutor' && textoLimpio.includes('Completaste tus 4 lecciones de hoy')) {
            setTimeout(async () => {
                await fetch('/cerrar-sesion', { method: 'POST' });
                btnEnviar.disabled = true;
                clearInterval(timerInterval);
                agregarMensaje('Sesión del día cerrada automáticamente. ¡Hasta mañana! 🌙', 'sistema');
            }, 3000);
        }
    }

    function mostrarTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing-indicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function ocultarTyping() {
        const t = document.getElementById('typing-indicator');
        if (t) t.remove();
    }

    async function enviarMensaje() {
        const texto = inputMensaje.value.trim();
        if (!texto && !imagenSeleccionada) return;

        const imagenPreview = imagenSeleccionada
            ? document.getElementById('preview-img').src : null;

        agregarMensaje(texto || '📷 Imagen enviada', 'usuario', imagenPreview);
        inputMensaje.value = '';
        btnEnviar.disabled = true;
        mostrarTyping();

        const formData = new FormData();
        formData.append('tiempoMinutos', segundosSesion / 60 | 0);

        formData.append('mensaje', texto || 'Analiza este ejercicio y ayúdame a resolverlo.');
        if (imagenSeleccionada) {
            formData.append('imagen', imagenSeleccionada);
        }

        limpiarImagen();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            ocultarTyping();
            agregarMensaje(data.respuesta, 'tutor');
        } catch (error) {
            ocultarTyping();
            agregarMensaje('Hubo un error. Intenta de nuevo.', 'sistema');
        } finally {
            btnEnviar.disabled = false;
            inputMensaje.focus();
        }
    }

    let sesionCerrada = false;
    async function cerrarSesion() {
        if (sesionCerrada) return;
        sesionCerrada = true;
        clearInterval(timerInterval);

        const resp = await fetch('/cerrar-sesion', { method: 'POST' });
        const data = await resp.json();
        console.log('Sesión cerrada:', data);
        agregarMensaje('✅ Lección guardada. ¡Descansa 15 minutos! 💪', 'sistema');
        btnEnviar.disabled = true;
        // Recargar página después de 3 segundos
        setTimeout(() => { window.location.reload(); }, 3000);
    }

    btnEnviar.addEventListener('click', enviarMensaje);
    inputMensaje.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensaje();
        }
    });
    inputMensaje.addEventListener('input', () => {
        inputMensaje.style.height = '44px';
        inputMensaje.style.height = Math.min(inputMensaje.scrollHeight, 120) + 'px';
    });
</script>

</body>
</html>
